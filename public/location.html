<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Location Details</h1>
        <nav>
            <a href="adventures.html">Adventures</a>
            <a href="locations.html">Locations</a>
        </nav>
    </header>
    <main>
        <form onsubmit="event.preventDefault(); window.location.href='locations.html';">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name">
            </div>
            <div class="form-group">
                <label for="country">Country:</label>
                <input type="text" id="country">
            </div>
            <div class="form-group">
                <label for="latitude">Latitude:</label>
                <input type="text" id="latitude">
            </div>
            <div class="form-group">
                <label for="longitude">Longitude:</label>
                <input type="text" id="longitude">
            </div>
            <div class="form-group">
                <label for="google-maps">Google Maps link:</label>
                <textarea id="google-maps"></textarea>
            </div>
            <div class="button-container">
                <button type="submit" class="button">Save</button>
                <button type="button" class="button delete" onclick="window.location.href='locations.html';">Delete</button>
            </div>
        </form>
    </main>
</body>
</html>

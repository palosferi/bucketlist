<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Adventure Details</h1>
        <nav>
            <a href="adventures.html">Adventures</a>
            <a href="locations.html">Locations</a>
        </nav>
    </header>
    <main>
        <form onsubmit="event.preventDefault(); window.location.href='adventures.html';">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name">
            </div>
            <div class="form-group">
                <label for="type">Type:</label>
                <input type="text" id="type">
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location">
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description"></textarea>
            </div>
            <div class="button-container">
                <button type="submit" class="button">Save</button>
                <button type="button" class="button delete" onclick="window.location.href='adventures.html';">Delete</button>
            </div>
        </form>
    </main>
</body>
</html>

# Routes https://ferencpalos.is-a.dev/adventures to the Adventures app.
#
# Lives here rather than in a Nginx Proxy Manager "custom location" because
# this file is included in every proxy server block by NPM itself, survives
# restarts and upgrades, and needs no change to NPM's database. Removing this
# file and reloading nginx fully reverts the routing.
#
# The include is server-wide, so the host guard keeps the app off the other
# domains this proxy serves.
location /adventures {
    if ($host != "ferencpalos.is-a.dev") {
        return 404;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;
    proxy_http_version 1.1;

    # conf.d/include/proxy.conf is deliberately not included here: it carries
    # its own proxy_pass for the host's default backend, which would clash.
    # No URI part on proxy_pass, so nginx forwards the original path unchanged,
    # including the /adventures prefix the app is mounted under.
    proxy_pass http://bucketlist:3000;

    client_max_body_size 15m;   # photo uploads
}
